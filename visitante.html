<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E8D2B2">
  <meta name="description" content="Conheça a Comunidade Apostólica Restaurando Almas — C.A.R.A.">
  <title>Visitante — C.A.R.A.</title>
  <link rel="icon" href="./icon-192.png">
  <style>
    :root{
      --bege:#E8D2B2;
      --terracota:#8F321B;
      --aveia:#E9DDD2;
      --musgo:#284703;
      --dourado:#D9A441;
      --texto:#284703;
      --sombra:0 10px 24px rgba(65,39,20,.13);
      --raio:22px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100vh;background:var(--bege);color:var(--musgo);font-family:Georgia,"Times New Roman",serif}
    a{color:inherit}
    .pagina{min-height:100vh;display:flex;flex-direction:column;overflow:hidden}
    .topo{position:relative;z-index:5;background:var(--bege);padding:14px clamp(16px,4vw,34px) 12px;border-bottom:3px solid var(--dourado)}
    .topo-inner{width:min(1120px,100%);margin:auto;display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:14px}
    .menu-btn{width:48px;height:48px;border:1.5px solid rgba(40,71,3,.22);border-radius:15px;background:rgba(255,255,255,.25);display:grid;place-items:center;color:var(--musgo);cursor:pointer}
    .menu-btn svg{width:25px;height:25px}
    .marca{display:flex;align-items:center;justify-content:center;gap:12px;min-width:0}
    .marca-fundo{background:var(--musgo);border-radius:15px;padding:8px 13px;display:flex;align-items:center;justify-content:center;min-width:0;box-shadow:0 4px 10px rgba(40,71,3,.15)}
    .marca img{display:block;width:min(100%,330px);height:62px;object-fit:contain}
    .marca-texto{display:none;text-align:center;color:var(--musgo);font-weight:700;line-height:1.05}
    .marca-texto strong{font-size:clamp(22px,4vw,32px);letter-spacing:2px;display:block}
    .marca-texto span{font-size:11px;letter-spacing:.6px}
    .visitante-tag{display:inline-flex;align-items:center;gap:8px;background:var(--terracota);color:#fff;border:1.5px solid var(--dourado);border-radius:999px;padding:11px 16px;font:700 13px Arial,sans-serif;white-space:nowrap;box-shadow:0 4px 10px rgba(74,30,14,.16)}
    .visitante-tag svg{width:18px;height:18px}
    .conteudo{width:min(1120px,100%);margin:0 auto;padding:0 clamp(14px,3vw,28px) 24px;flex:1}
    .hero{position:relative;margin:16px 0 18px;min-height:220px;border-radius:26px;overflow:hidden;background:linear-gradient(115deg,rgba(40,71,3,.88),rgba(40,71,3,.66)),radial-gradient(ellipse at 15% 45%,#F4C36B 0 9%,transparent 10%),linear-gradient(135deg,#B9684B,#E8B56D 52%,#667447);box-shadow:var(--sombra);display:flex;align-items:center;justify-content:center;text-align:center;padding:30px 18px}
    .hero:before{content:"";position:absolute;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,#FFE4A6 0 5%,rgba(255,205,112,.65) 6% 18%,rgba(255,205,112,.08) 58%,transparent 70%);left:-42px;top:-62px}
    .hero:after{content:"";position:absolute;inset:auto -5% -60px;height:145px;background:linear-gradient(160deg,transparent 0 20%,rgba(30,55,5,.28) 21% 35%,transparent 36%),linear-gradient(10deg,#263D16,#52663A);clip-path:polygon(0 40%,13% 15%,28% 38%,43% 8%,58% 35%,72% 12%,88% 37%,100% 18%,100% 100%,0 100%);opacity:.68}
    .hero-conteudo{position:relative;z-index:1;max-width:760px}
    .saudacao{display:inline-block;margin:0 0 13px;padding:7px 23px 10px;color:#fff;background:var(--musgo);border:1px solid rgba(217,164,65,.85);border-radius:48% 18% 42% 15% / 18% 48% 20% 45%;font-size:clamp(30px,6vw,54px);font-style:italic;font-weight:700;line-height:1.1;text-shadow:0 2px 4px #182b02}
    .slogan{margin:0 auto;color:#fff;font-size:clamp(16px,2.5vw,23px);line-height:1.4;font-style:italic;font-weight:700;text-shadow:0 2px 5px rgba(0,0,0,.35);max-width:680px}
    .slogan-linha{width:min(270px,55%);height:4px;border-radius:100%;background:var(--dourado);margin:16px auto 0;box-shadow:0 1px 3px #4b3213}
    .secao-titulo{margin:20px 0 14px;text-align:center;color:var(--musgo);font-size:clamp(21px,3vw,27px);font-weight:700}
    .secao-titulo:before,.secao-titulo:after{content:"";display:inline-block;vertical-align:middle;width:clamp(28px,8vw,90px);height:2px;background:var(--dourado);margin:0 13px;transform:skewX(-28deg)}
    .grade{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
    .card{position:relative;min-height:176px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-decoration:none;text-align:center;overflow:hidden;background:var(--aveia);border:2px solid var(--dourado);border-radius:23px;box-shadow:var(--sombra);transition:transform .18s ease,box-shadow .18s ease}
    .card:hover,.card:focus-visible{transform:translateY(-3px);box-shadow:0 14px 26px rgba(65,39,20,.2);outline:3px solid rgba(40,71,3,.2);outline-offset:2px}
    .card-icone{flex:1;min-height:112px;width:100%;display:grid;place-items:center;padding:18px 12px 10px;color:var(--musgo)}
    .card-icone svg{width:66px;height:66px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .card-nome{width:100%;min-height:55px;display:flex;align-items:center;justify-content:center;padding:9px 8px;background:var(--terracota);color:#fff;font-size:clamp(16px,2.2vw,21px);font-weight:700;line-height:1.12;border-top:1px solid rgba(217,164,65,.7)}
    .rodape-imagem{position:relative;height:80px;margin:22px 0 0;display:flex;align-items:center;justify-content:center;overflow:hidden}
    .livro{position:relative;width:180px;height:56px;filter:drop-shadow(0 5px 4px rgba(40,25,10,.2))}
    .livro:before,.livro:after{content:"";position:absolute;bottom:0;width:50%;height:48px;background:linear-gradient(100deg,#8A5525,#E8C58A 50%,#F7E7C8);border:2px solid #9C713E}
    .livro:before{left:0;border-radius:5px 2px 3px 12px;transform:skewY(-8deg);transform-origin:bottom right}
    .livro:after{right:0;border-radius:2px 5px 12px 3px;transform:skewY(8deg);transform-origin:bottom left}
    .nav-inferior{margin-top:auto;background:var(--musgo);border-top:4px solid var(--dourado);color:#fff;padding:12px 18px calc(12px + env(safe-area-inset-bottom));}
    .nav-inner{width:min(650px,100%);margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .nav-link{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;font:700 13px Arial,sans-serif;color:#fff;padding:5px;border-radius:12px}
    .nav-link svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .nav-link.ativo{color:var(--dourado)}
    .nav-link:focus-visible{outline:2px solid var(--dourado);outline-offset:2px}
    .menu-overlay{position:fixed;inset:0;background:rgba(18,29,9,.48);z-index:20;display:none}
    .menu-overlay.aberto{display:block}
    .gaveta{position:absolute;top:0;left:0;height:100%;width:min(330px,86vw);background:var(--bege);padding:22px 18px;box-shadow:10px 0 30px rgba(0,0,0,.2);transform:translateX(-100%);transition:transform .22s ease}
    .menu-overlay.aberto .gaveta{transform:translateX(0)}
    .gaveta-topo{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
    .gaveta-titulo{font-size:20px;font-weight:700;color:var(--musgo)}
    .fechar-menu{width:38px;height:38px;border:0;border-radius:50%;background:var(--aveia);color:var(--musgo);font-size:24px;cursor:pointer}
    .gaveta a{display:flex;align-items:center;gap:12px;padding:14px 10px;margin:5px 0;border-radius:12px;background:var(--aveia);color:var(--musgo);text-decoration:none;font:700 15px Arial,sans-serif}
    .gaveta a span{width:27px;text-align:center;color:var(--terracota)}
    .aviso-futuro{position:fixed;left:50%;bottom:92px;transform:translate(-50%,14px);z-index:30;max-width:calc(100vw - 32px);padding:12px 17px;border-radius:14px;background:var(--musgo);color:#fff;border:1px solid var(--dourado);font:600 13px Arial,sans-serif;box-shadow:var(--sombra);opacity:0;pointer-events:none;transition:.2s;text-align:center}
    .aviso-futuro.mostrar{opacity:1;transform:translate(-50%,0)}
    @media(max-width:700px){
      .topo{padding:10px 12px 9px}.topo-inner{grid-template-columns:42px 1fr auto;gap:8px}.menu-btn{width:40px;height:40px;border-radius:12px}.marca-fundo{padding:6px 9px;border-radius:12px}.marca img{height:48px;width:min(100%,240px)}.visitante-tag{padding:9px 11px;font-size:11px;gap:5px}.visitante-tag svg{width:15px;height:15px}
      .conteudo{padding:0 13px 18px}.hero{min-height:190px;margin:13px 0 14px;border-radius:21px}.grade{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-height:152px;border-radius:19px}.card-icone{min-height:100px}.card-icone svg{width:58px;height:58px}.card-nome{min-height:49px;font-size:17px}.secao-titulo{font-size:21px;margin:16px 0 12px}.secao-titulo:before,.secao-titulo:after{margin:0 7px;width:24px}.rodape-imagem{height:56px;margin-top:12px}.livro{transform:scale(.78)}
    }
    @media(max-width:370px){.topo-inner{grid-template-columns:36px 1fr auto;gap:6px}.menu-btn{width:35px;height:35px}.marca img{height:41px}.visitante-tag{font-size:10px;padding:8px}.card-nome{font-size:15px}.card{min-height:142px}}
    @media(min-width:701px){.hero{min-height:250px}.card{min-height:190px}.card-icone svg{width:76px;height:76px}.card-nome{min-height:62px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<div class="pagina">
  <header class="topo">
    <div class="topo-inner">
      <button class="menu-btn" id="abrirMenu" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="menuVisitante">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="marca" aria-label="Comunidade Apostólica Restaurando Almas">
        <div class="marca-fundo"><img src="./logo-cara.png" alt="C.A.R.A. — Comunidade Apostólica Restaurando Almas"></div>
      </div>
      <div class="visitante-tag">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 20v-1.5a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4V20M9 10a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7ZM20 8v6m3-3h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        Visitante
      </div>
    </div>
  </header>

  <main class="conteudo">
    <section class="hero" aria-labelledby="saudacao">
      <div class="hero-conteudo">
        <h1 class="saudacao" id="saudacao">Shalom, Shalom!</h1>
        <p class="slogan">Um amor que acolhe, a verdade que liberta e a graça que restaura!</p>
        <div class="slogan-linha" aria-hidden="true"></div>
      </div>
    </section>

    <h2 class="secao-titulo">Conheça nossa comunidade</h2>
    <nav class="grade" aria-label="Seções da área do visitante">
      <a class="card" href="./quem-somos.html" data-em-breve="Quem Somos">
        <span class="card-icone"><svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="17" r="9"/><circle cx="12" cy="25" r="6"/><circle cx="52" cy="25" r="6"/><path d="M14 52v-5c0-8 7-14 15-14h6c8 0 15 6 15 14v5H14ZM2 51v-4c0-6 4-11 10-12m50 16v-4c0-6-4-11-10-12"/></svg></span>
        <span class="card-nome">Quem Somos</span>
      </a>
      <a class="card" href="./agenda-visitante.html" data-em-breve="Agenda">
        <span class="card-icone"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="8" y="13" width="48" height="43" rx="6"/><path d="M20 7v12M44 7v12M8 25h48M19 34h7m8 0h7m-22 9h7m8 0h7"/></svg></span>
        <span class="card-nome">Agenda</span>
      </a>
      <a class="card" href="./louvores-visitante.html" data-em-breve="Louvores">
        <span class="card-icone"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M39 10v34.5a8 8 0 1 1-5-7.4V17l22-5v27.5a8 8 0 1 1-5-7.4V7l-12 3Z"/></svg></span>
        <span class="card-nome">Louvores</span>
      </a>
      <a class="card" href="./acao-social.html" data-em-breve="Ação Social">
        <span class="card-icone"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 53S8 39 8 23a12 12 0 0 1 22-6 12 12 0 0 1 26 6c0 16-24 30-24 30Z"/><path d="M5 48h13l7-8h11l6 5 8-7 9 6-13 12H22l-5-4H5"/></svg></span>
        <span class="card-nome">Ação Social</span>
      </a>
      <a class="card" href="./catalogo.html" data-em-breve="Catálogo">
        <span class="card-icone"><svg viewBox="0 0 64 64" aria-hidden="true"><path d="M7 10h7l6 32h31l7-23H18M24 51a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm21 0a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/><path d="M25 26h24M29 19v14m12-14v14"/></svg></span>
        <span class="card-nome">Catálogo</span>
      </a>
    </nav>
    <div class="rodape-imagem" aria-hidden="true"><div class="livro"></div></div>
  </main>

  <nav class="nav-inferior" aria-label="Navegação inferior">
    <div class="nav-inner">
      <a class="nav-link ativo" href="./visitante.html" aria-current="page"><svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>Início</span></a>
      <a class="nav-link" href="./quem-somos.html" data-em-breve="Quem Somos"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg><span>Sobre</span></a>
      <a class="nav-link" href="https://www.instagram.com/comunidadecara/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg><span>Instagram</span></a>
    </div>
  </nav>
</div>

<div class="menu-overlay" id="menuVisitante" aria-hidden="true">
  <aside class="gaveta" role="dialog" aria-modal="true" aria-label="Menu do visitante">
    <div class="gaveta-topo"><strong class="gaveta-titulo">C.A.R.A. — Visitante</strong><button class="fechar-menu" id="fecharMenu" type="button" aria-label="Fechar menu">×</button></div>
    <a href="./visitante.html"><span>⌂</span>Início</a>
    <a href="./quem-somos.html" data-em-breve="Quem Somos"><span>◎</span>Quem Somos</a>
    <a href="./agenda-visitante.html" data-em-breve="Agenda"><span>▦</span>Agenda</a>
    <a href="./louvores-visitante.html" data-em-breve="Louvores"><span>♫</span>Louvores</a>
    <a href="./acao-social.html" data-em-breve="Ação Social"><span>♡</span>Ação Social</a>
    <a href="./catalogo.html" data-em-breve="Catálogo"><span>▣</span>Catálogo</a>
    <a href="./entrada.html"><span>↩</span>Voltar à entrada</a>
  </aside>
</div>
<div class="aviso-futuro" id="avisoFuturo" role="status" aria-live="polite"></div>

<script>
(function(){
  const overlay=document.getElementById('menuVisitante');
  const abrir=document.getElementById('abrirMenu');
  const fechar=document.getElementById('fecharMenu');
  const aviso=document.getElementById('avisoFuturo');
  let avisoTimer;
  function abrirMenu(){overlay.classList.add('aberto');overlay.setAttribute('aria-hidden','false');abrir.setAttribute('aria-expanded','true');fechar.focus();}
  function fecharMenu(){overlay.classList.remove('aberto');overlay.setAttribute('aria-hidden','true');abrir.setAttribute('aria-expanded','false');abrir.focus();}
  abrir.addEventListener('click',abrirMenu);
  fechar.addEventListener('click',fecharMenu);
  overlay.addEventListener('click',e=>{if(e.target===overlay)fecharMenu();});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('aberto'))fecharMenu();});
  document.querySelectorAll('[data-em-breve]').forEach(link=>link.addEventListener('click',e=>{
    e.preventDefault();
    const nome=link.getAttribute('data-em-breve');
    aviso.textContent=nome+' — estamos preparando esta área. Em breve estará disponível!';
    aviso.classList.add('mostrar');
    clearTimeout(avisoTimer);avisoTimer=setTimeout(()=>aviso.classList.remove('mostrar'),3000);
    if(overlay.classList.contains('aberto'))fecharMenu();
  }));
})();
</script>
</body>
</html>
