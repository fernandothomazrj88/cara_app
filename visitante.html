<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080D18">
  <meta name="description" content="Conheça a Comunidade Apostólica Restaurando Almas — C.A.R.A.">
  <title>Área do Visitante — C.A.R.A.</title>
  <link rel="icon" href="./icon-192.png">
  <style>
    :root{
      --preto-azulado:#080D18;
      --lima:#CCFF00;
      --branco:#FFFFFF;
      --azul:#172235;
      --sombra:0 8px 20px rgba(8,13,24,.12);
      --raio:20px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth;background:var(--branco)}
    body{margin:0;min-height:100vh;background:var(--branco);color:var(--preto-azulado);font-family:Inter,Arial,Helvetica,sans-serif}
    button,a{-webkit-tap-highlight-color:transparent}
    button{font:inherit}
    .pagina{min-height:100vh;display:flex;flex-direction:column;padding-bottom:76px;overflow:hidden}
    .topo{position:relative;z-index:5;background:var(--preto-azulado);border-bottom:4px solid var(--lima);padding:7px clamp(12px,3vw,28px)}
    .topo-inner{width:min(1120px,100%);min-height:142px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
    .marca{display:flex;justify-content:center;align-items:center;min-width:0;height:132px;width:100%}
    .marca img{display:block;width:min(100%,370px);height:auto;max-height:132px;object-fit:contain;object-position:center}
    .voltar{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 17px;border-radius:999px;background:var(--azul);border:2px solid var(--lima);color:var(--branco);font-size:14px;font-weight:800;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s}
    .voltar:hover,.voltar:focus-visible{background:var(--lima);color:var(--preto-azulado);outline:2px solid var(--branco);outline-offset:2px}
    .voltar svg{width:18px;height:18px;stroke:var(--lima);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .voltar:hover svg,.voltar:focus-visible svg{stroke:var(--preto-azulado)}
    main{width:min(1060px,100%);margin:0 auto;padding:0 clamp(12px,3vw,26px) 22px;flex:1}
    .hero{min-height:166px;margin:14px 0 13px;border-radius:22px;overflow:hidden;background:var(--azul);box-shadow:var(--sombra);display:flex;align-items:center;justify-content:center;text-align:center;padding:22px 20px}
    .hero-conteudo{max-width:790px}
    .saudacao{display:inline-block;margin:0;color:var(--branco);font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,6vw,55px);font-style:italic;font-weight:700;line-height:1.1}
    .saudacao-linha{width:min(300px,65%);height:5px;margin:10px auto 13px;border-radius:50%;background:var(--lima);transform:rotate(-1.5deg)}
    .slogan{max-width:730px;margin:0 auto;color:var(--branco);font-size:clamp(15px,2.4vw,21px);font-weight:750;font-style:italic;line-height:1.35}
    .titulo-secao{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 13px;text-align:center;color:var(--preto-azulado);font-size:clamp(18px,2.8vw,24px);font-weight:850}
    .titulo-secao:before,.titulo-secao:after{content:"";width:clamp(22px,7vw,76px);height:3px;border-radius:10px;background:var(--lima)}
    .grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .card{min-height:112px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-decoration:none;border:2px solid var(--azul);border-radius:19px;background:var(--lima);color:var(--preto-azulado);box-shadow:var(--sombra);transition:transform .16s ease,box-shadow .16s ease;cursor:pointer;padding:10px 10px 0}
    .card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 11px 22px rgba(8,13,24,.2);outline:2px solid var(--lima);outline-offset:2px}
    .card-icone{height:61px;display:grid;place-items:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:43px;line-height:1}
    .card-rodape{width:calc(100% + 20px);min-height:42px;margin:0 -10px;padding:8px 10px;background:var(--azul);color:var(--branco);display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(15px,2vw,19px);font-weight:800;line-height:1.12}
    .card-catalogo{grid-column:1/-1;min-height:68px;justify-content:center;padding:8px 16px}
    .card-catalogo .card-rodape{width:100%;min-height:0;margin:0;padding:8px;background:transparent;color:var(--preto-azulado);font-size:clamp(19px,3vw,24px)}
    .aviso{position:fixed;z-index:30;left:50%;bottom:88px;transform:translate(-50%,12px);width:min(90%,420px);padding:12px 16px;border-radius:14px;background:var(--preto-azulado);border:1px solid var(--lima);color:var(--branco);font-size:14px;text-align:center;box-shadow:var(--sombra);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
    .aviso.visivel{opacity:1;transform:translate(-50%,0)}
    .nav-inferior{position:fixed;z-index:20;left:0;right:0;bottom:0;min-height:68px;padding:7px max(12px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:var(--azul);border-top:4px solid var(--lima);display:flex;justify-content:center;box-shadow:0 -5px 18px rgba(8,13,24,.12)}
    .nav-inner{width:min(720px,100%);display:grid;grid-template-columns:repeat(3,1fr);align-items:center}
    .nav-item{min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:var(--branco);font-size:12px;font-weight:700}
    .nav-item svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .nav-item.ativo{color:var(--lima)}
    .nav-item+.nav-item{border-left:1px solid rgba(204,255,0,.55)}
    @media(min-width:760px){.hero{min-height:190px;margin-top:18px}.card{min-height:132px}.card-icone{height:75px;font-size:50px}.card-rodape{min-height:48px}.card-catalogo{min-height:78px}}
    @media(max-width:520px){
      .topo{padding:5px 10px}.topo-inner{min-height:116px;grid-template-columns:minmax(0,1fr) auto;gap:8px}.marca{height:108px}.marca img{width:min(100%,320px);height:auto;max-height:108px}.voltar{min-height:40px;padding:8px 11px;font-size:12px;gap:5px}.voltar svg{width:16px;height:16px}
      main{padding-left:10px;padding-right:10px}.hero{min-height:158px;margin:11px 0 11px;border-radius:18px;padding:19px 12px}.saudacao{font-size:clamp(31px,8vw,43px)}.slogan{font-size:clamp(14px,3.5vw,17px)}.titulo-secao{font-size:18px;margin:10px 0 11px;gap:8px}.titulo-secao:before,.titulo-secao:after{width:23px}.grade{gap:10px}.card{min-height:104px;border-radius:16px;padding:8px 8px 0}.card-icone{height:54px;font-size:39px}.card-rodape{width:calc(100% + 16px);min-height:39px;margin:0 -8px;padding:7px 6px;font-size:15px}.card-catalogo{min-height:65px;padding:7px 12px}.card-catalogo .card-rodape{min-height:0;margin:0;padding:7px;font-size:19px}.pagina{padding-bottom:73px}.nav-inferior{min-height:65px}.nav-item{font-size:11px;min-height:44px}.nav-item svg{width:20px;height:20px}
    }
    @media(max-width:365px){.topo-inner{gap:5px;min-height:104px}.marca{height:96px}.marca img{max-height:96px}.voltar{font-size:11px;padding:7px 8px}.hero{min-height:148px}.card{min-height:98px}.card-rodape{font-size:14px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
<div class="pagina">
  <header class="topo">
    <div class="topo-inner">
      <a class="marca" href="./visitante.html" aria-label="Página inicial do visitante"><img src="./logo-cara.png" alt="C.A.R.A. — Comunidade Apostólica Restaurando Almas"></a>
      <a class="voltar" href="./entrada.html" aria-label="Voltar à tela inicial de acesso">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5m7 7-7-7 7-7"/></svg>
        Voltar
      </a>
    </div>
  </header>

  <main>
    <section class="hero" aria-label="Boas-vindas">
      <div class="hero-conteudo">
        <h1 class="saudacao">Shalom, Shalom!</h1>
        <div class="saudacao-linha"></div>
        <p class="slogan">Um amor que acolhe, a verdade que liberta e a graça que restaura!</p>
      </div>
    </section>

    <h2 class="titulo-secao">Conheça nossa comunidade</h2>

    <section class="grade" aria-label="Navegação do visitante">
      <a class="card" href="./quem-somos.html">
        <span class="card-icone" aria-hidden="true">👥</span>
        <span class="card-rodape">Quem Somos</span>
      </a>
      <a class="card" href="./agenda-visitante.html">
        <span class="card-icone" aria-hidden="true">📅</span>
        <span class="card-rodape">Agenda</span>
      </a>
      <a class="card" href="./louvor-visitante.html">
        <span class="card-icone" aria-hidden="true">🎶</span>
        <span class="card-rodape">Louvores</span>
      </a>
      <a class="card" href="./acao-social-visitante.html">
        <span class="card-icone" aria-hidden="true">🤲</span>
        <span class="card-rodape">Ação Social</span>
      </a>
      <a class="card card-catalogo" href="./catalogo-visitante.html">
        <span class="card-rodape">Catálogo</span>
      </a>
    </section>
  </main>

  <nav class="nav-inferior" aria-label="Navegação inferior">
    <div class="nav-inner">
      <a class="nav-item ativo" href="./visitante.html" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg><span>Início</span></a>
      <a class="nav-item" href="./quem-somos.html"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7h.01"/></svg><span>Sobre</span></a>
      <a class="nav-item" href="https://www.instagram.com/comunidadecara/" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/></svg><span>Instagram</span></a>
    </div>
  </nav>
</div>

<div class="aviso" id="aviso" role="status" aria-live="polite"></div>
<script>
(() => {
  const aviso = document.getElementById('aviso');
  let avisoTimer;
  function mostrarAviso(texto) {
    aviso.textContent = texto;
    aviso.classList.add('visivel');
    clearTimeout(avisoTimer);
    avisoTimer = setTimeout(() => aviso.classList.remove('visivel'), 2600);
  }
  document.querySelectorAll('[data-destino]').forEach(el => el.addEventListener('click', () => {
    const nome = el.getAttribute('data-destino');
    mostrarAviso('Estamos preparando a área “' + nome + '”. Em breve ela estará disponível!');
  }));
})();
</script>
</body>
</html>
