<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#051326">

  <title>Membros — C.A.R.A.</title>

  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">

  <style>
    *{box-sizing:border-box}

    :root{
      --n:#051326;
      --n2:#0b2039;
      --n3:#102b50;
      --y:#FFFF00;
      --w:#ffffff;
      --muted:#aebdce;
      --page:#071321;
      --green:#4e8f00;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      background:var(--page);
      color:var(--w);
      font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
      padding-bottom:105px;
    }

    .app{
      width:min(1120px,100%);
      margin:auto;
    }

    .hero{
      position:relative;
      width:100%;
      aspect-ratio:16/5.35;
      min-height:240px;
      overflow:hidden;
      background:#051326 url("./banner-membros.png") center center / cover no-repeat;
      border-bottom:3px solid var(--y);
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(90deg,rgba(5,19,38,.08),rgba(5,19,38,.02) 55%,rgba(5,19,38,.08));
      pointer-events:none;
    }

    .hero-content{
      position:absolute;
      inset:0;
      z-index:2;
    }

    .back{
      position:absolute;
      left:clamp(16px,5vw,70px);
      top:18px;
      display:inline-flex;
      align-items:center;
      min-height:42px;
      padding:0 14px;
      border:1px solid var(--y);
      border-radius:12px;
      color:var(--y);
      background:rgba(5,19,38,.28);
      text-decoration:none;
      font-weight:900;
      backdrop-filter:blur(3px);
    }

    .eyebrow,h1,.hero p{display:none;}

    main{
      width:min(1000px,calc(100% - 28px));
      margin:auto;
    }

    .toolbar{
      display:flex;
      gap:12px;
      align-items:center;
      margin:24px 0 18px;
    }

    .search{
      flex:1;
      display:flex;
      align-items:center;
      gap:10px;
      min-height:50px;
      padding:0 15px;
      border-radius:15px;
      background:#0c223b;
      border:1px solid #ffffff15;
    }

    .search span{
      font-size:21px;
    }

    .search input{
      width:100%;
      border:0;
      outline:0;
      background:transparent;
      color:#fff;
      font:inherit;
      font-size:15px;
    }

    .search input::placeholder{
      color:#8295a9;
    }

    .contador{
      color:var(--muted);
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }

    .grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
    }

    .card{
      display:flex;
      align-items:center;
      gap:14px;
      min-height:118px;
      padding:15px;
      border-radius:20px;
      border:1px solid #ffffff12;
      background:linear-gradient(145deg,#102d4d,#0b2039);
      color:#fff;
      text-decoration:none;
      cursor:pointer;
      text-align:left;
      box-shadow:0 10px 25px #0004;
      transition:transform .15s ease,filter .15s ease;
    }

    .card:hover{
      filter:brightness(1.06);
    }

    .card:active{
      transform:scale(.98);
    }

    .avatar{
      width:70px;
      height:70px;
      flex:0 0 70px;
      border-radius:20px;
      overflow:hidden;
      display:grid;
      place-items:center;
      background:linear-gradient(145deg,#1d4c78,#0c2947);
      border:2px solid #ffff0050;
      color:var(--y);
      font-size:25px;
      font-weight:900;
    }

    .avatar img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .dados{
      min-width:0;
      flex:1;
    }

    .nome{
      font-size:17px;
      font-weight:900;
      line-height:1.15;
      word-break:break-word;
    }

    .status{
      display:inline-flex;
      margin-top:7px;
      padding:4px 8px;
      border-radius:999px;
      background:#4e8f0022;
      color:#b9ed69;
      font-size:9px;
      font-weight:900;
      letter-spacing:.7px;
    }

    .ministerios{
      display:flex;
      flex-wrap:wrap;
      gap:5px;
      margin-top:8px;
    }

    .ministerio{
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      padding:4px 7px;
      border-radius:8px;
      background:#ffff0010;
      color:#dce7f2;
      font-size:9px;
      font-weight:800;
    }

    .seta{
      color:var(--y);
      font-size:26px;
      flex:0 0 auto;
    }

    .loading,
    .vazio,
    .erro{
      grid-column:1/-1;
      padding:25px;
      border-radius:18px;
      background:#0c223b;
      color:var(--muted);
      text-align:center;
    }

    .erro{
      color:#ffb5b5;
      border:1px solid #ff6b6b33;
    }

    .modal{
      position:fixed;
      inset:0;
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding:18px;
      background:#000b;
      z-index:100;
    }

    .modal.aberto{
      display:flex;
    }

    .sheet{
      width:min(620px,100%);
      max-height:90vh;
      overflow:auto;
      border-radius:26px 26px 18px 18px;
      background:#081a30;
      border:1px solid #ffffff18;
      box-shadow:0 20px 60px #0008;
    }

    .sheet-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:15px;
      padding:20px 20px 12px;
      position:sticky;
      top:0;
      background:#081a30ee;
      backdrop-filter:blur(10px);
    }

    .sheet-top h2{
      margin:0;
      font-size:21px;
    }

    .fechar{
      width:40px;
      height:40px;
      border:0;
      border-radius:12px;
      background:#122b48;
      color:#fff;
      font-size:19px;
      cursor:pointer;
    }

    .perfil{
      padding:10px 20px 24px;
    }

    .perfil-topo{
      display:flex;
      align-items:center;
      gap:16px;
      padding:10px 0 20px;
    }

    .avatar-grande{
      width:100px;
      height:100px;
      flex:0 0 100px;
      border-radius:28px;
      overflow:hidden;
      display:grid;
      place-items:center;
      background:linear-gradient(145deg,#1d4c78,#0c2947);
      border:2px solid var(--y);
      color:var(--y);
      font-size:35px;
      font-weight:900;
    }

    .avatar-grande img{
      width:100%;
      height:100%;
      object-fit:cover;
    }

    .perfil-nome{
      font-size:24px;
      font-weight:900;
      line-height:1.1;
    }

    .perfil-status{
      margin-top:7px;
      color:#b9ed69;
      font-size:11px;
      font-weight:900;
      letter-spacing:1px;
    }

    .secao{
      margin-top:18px;
      padding:16px;
      border-radius:17px;
      background:#0c223b;
      border:1px solid #ffffff10;
    }

    .secao-titulo{
      color:var(--y);
      font-size:10px;
      font-weight:900;
      letter-spacing:1.6px;
      margin-bottom:10px;
    }

    .lista-min{
      display:flex;
      flex-wrap:wrap;
      gap:7px;
    }

    .tag{
      padding:7px 10px;
      border-radius:10px;
      background:#ffff0010;
      color:#fff;
      font-size:12px;
      font-weight:800;
    }

    .observacao{
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
    }

    .bottom{
      position:fixed;
      left:50%;
      bottom:0;
      transform:translateX(-50%);
      width:100%;
      max-width:900px;
      min-height:82px;
      padding-bottom:env(safe-area-inset-bottom);
      background:linear-gradient(135deg,#06141a,#091c24);
      display:grid;
      grid-template-columns:repeat(5,1fr);
      border-radius:24px 24px 0 0;
      box-shadow:0 -6px 24px #0003;
      z-index:50;
    }

    .bottom a{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:5px;
      color:#eee;
      text-decoration:none;
      font-size:10px;
    }

    .bottom a b{
      font-size:23px;
      line-height:1;
    }

    .bottom .ativo{
      color:var(--y);
      font-weight:900;
    }

    @media(max-width:800px){
      .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    @media(max-width:600px){
      .hero{
        aspect-ratio:16/7.2;
        min-height:190px;
        background-position:center center;
      }

      .back{
        left:12px;
        top:12px;
      }

      main{
        width:min(100% - 20px,1000px);
      }

      .toolbar{
        align-items:stretch;
        flex-direction:column;
      }

      .grid{
        grid-template-columns:1fr;
      }

      .card{
        min-height:105px;
      }

      .avatar{
        width:64px;
        height:64px;
        flex-basis:64px;
      }

      .modal{
        padding:8px;
      }
    }

    .ficha-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .campo{padding:12px;border-radius:12px;background:#081a30;border:1px solid #ffffff10}
    .campo-label{color:#8fa6bd;font-size:9px;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
    .campo-valor{color:#fff;font-size:13px;font-weight:700;line-height:1.35;word-break:break-word}
    .ficha-bloco{margin-top:14px;padding:16px;border-radius:17px;background:#0c223b;border:1px solid #ffffff10}
    .ficha-bloco-titulo{color:var(--y);font-size:10px;font-weight:900;letter-spacing:1.6px;margin-bottom:10px}
    .ministerio-ficha{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff0d}
    .ministerio-ficha:last-child{border-bottom:0}
    .ministerio-nome{font-weight:900;font-size:13px}
    .ministerio-funcao{color:#aebdce;font-size:11px;margin-top:3px}
    .privado-aviso{padding:13px;border-radius:13px;background:#ffff0010;border:1px solid #ffff0025;color:#dfe9f4;font-size:12px;line-height:1.45}
    .botao-login{display:inline-flex;align-items:center;gap:8px;margin-top:12px;min-height:42px;padding:0 14px;border:1px solid #ffffff25;border-radius:12px;background:#fff;color:#111;font-weight:900;cursor:pointer}
    .login-msg{margin-top:10px;color:#ffb5b5;font-size:12px}
    .acoes-ficha{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
    .botao-ficha{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 15px;border:1px solid #ffffff20;border-radius:12px;font-weight:900;cursor:pointer;font-family:inherit}
    .botao-editar{background:var(--y);color:#071321}
    .botao-cancelar{background:#122b48;color:#fff}
    .botao-salvar{background:#2f7900;color:#fff}
    .campo-input,.campo-select,.campo-textarea{width:100%;border:1px solid #ffffff18;border-radius:10px;background:#06172b;color:#fff;padding:10px;font:inherit;font-size:13px;outline:none}
    .campo-input:focus,.campo-select:focus,.campo-textarea:focus{border-color:#ffff00}
    .campo-textarea{min-height:90px;resize:vertical}
    .foto-editor{display:flex;align-items:center;gap:16px;padding:14px;border-radius:16px;background:#081a30;border:1px dashed #ffff0055;margin-bottom:14px}
    .foto-editor .avatar-grande{flex:0 0 110px;width:110px;height:110px}
    .foto-acoes{display:flex;flex-direction:column;gap:7px}
    .botao-foto{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 12px;border-radius:10px;background:#17385d;color:#fff;border:1px solid #ffffff20;font-weight:800;cursor:pointer}
    .foto-ajuda{color:#8fa6bd;font-size:10px;line-height:1.4}
    .salvando{opacity:.65;pointer-events:none}
    .sucesso-msg{color:#b9ed69;font-size:12px;margin-top:8px}
    @media(max-width:600px){.ficha-grid{grid-template-columns:1fr}.foto-editor{align-items:flex-start;flex-direction:column}.foto-acoes{width:100%}}
  </style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

<div class="app">

  <header class="hero">
    <div class="hero-content">
      <a class="back" href="./index.html">← Início</a>

      <span aria-label="Membros"></span>
    </div>
  </header>

  <main>

    <div class="toolbar">
      <label class="search">
        <span>🔎</span>
        <input
          id="busca"
          type="search"
          placeholder="Buscar membro..."
          autocomplete="off"
        >
      </label>

      <div id="contador" class="contador">Carregando...</div>
    </div>

    <section id="lista" class="grid">
      <div class="loading">Carregando membros...</div>
    </section>

  </main>

</div>

<nav class="bottom">
  <a href="./index.html">
    <b>🏠</b>
    Início
  </a>

  <a href="./agenda.html">
    <b>📅</b>
    Agenda
  </a>

  <a href="./ministerios.html">
    <b>▦</b>
    Ministérios
  </a>

  <a href="./index.html" onclick="return false;" aria-disabled="true">
    <b>🔔</b>
    Avisos
  </a>

  <a class="ativo" href="./membros.html">
    <b>👥</b>
    Membros
  </a>
</nav>


<div id="loginGoogle" style="display:none"></div>

<div id="modal" class="modal" aria-hidden="true">
  <section class="sheet" role="dialog" aria-modal="true">

    <div class="sheet-top">
      <h2>Perfil do membro</h2>
      <button class="fechar" type="button" onclick="fecharPerfil()">✕</button>
    </div>

    <div id="perfil" class="perfil"></div>

  </section>
</div>

<script>
const API =
  'https://script.google.com/macros/s/AKfycbwFGFIC3s9i6X7qsKzrfJju59Y0UXBrfS2UgNKx6P_htJWHkyguZTaceL9ohG30rAML/exec';

let membros = [];
let membrosExibidos = [];

function esc(v){
  return String(v ?? '')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function iniciais(nome){
  const partes = String(nome || 'Membro')
    .trim()
    .split(/\s+/)
    .filter(Boolean);

  if(!partes.length) return 'M';

  if(partes.length === 1){
    return partes[0].slice(0,2).toUpperCase();
  }

  return (
    partes[0][0] +
    partes[partes.length - 1][0]
  ).toUpperCase();
}

function normalizarFotoMembro(url){
  const original=String(url||'').trim();
  if(!original) return '';
  try{
    const u=new URL(original);
    const id=u.searchParams.get('id');
    if(id) return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(id)+'&sz=w1000';
    const parte=u.pathname.split('/d/')[1];
    const idPath=parte?parte.split('/')[0]:'';
    if(idPath) return 'https://drive.google.com/thumbnail?id='+encodeURIComponent(idPath)+'&sz=w1000';
    return original;
  }catch(e){return original}
}

function renderAvatar(pessoa, grande=false){
  const classe=grande?'avatar-grande':'avatar';
  const foto=normalizarFotoMembro(pessoa.fotoUrl);
  if(foto){
    const inic=esc(iniciais(pessoa.nome));
    return `
      <div class="${classe}">
        <img src="${esc(foto)}" alt="Foto de ${esc(pessoa.nome)}"
          loading="eager" decoding="async" referrerpolicy="no-referrer"
          onerror="this.onerror=null;this.parentElement.innerHTML='${inic}';">
      </div>`;
  }
  return `<div class="${classe}">${esc(iniciais(pessoa.nome))}</div>`;
}

function render(lista){
  const container = document.getElementById('lista');
  const contador = document.getElementById('contador');

  membrosExibidos = lista;

  contador.textContent =
    `${lista.length} ${lista.length === 1 ? 'membro' : 'membros'}`;

  if(!lista.length){
    container.innerHTML = `
      <div class="vazio">
        Nenhum membro encontrado.
      </div>
    `;
    return;
  }

  container.innerHTML = lista.map((pessoa, index) => {
    const mins = Array.isArray(pessoa.ministerios)
      ? pessoa.ministerios
      : [];

    return `
      <a
        href="#"
        class="card"
        onclick="abrirPerfil(${index}); return false;"
      >
        ${renderAvatar(pessoa)}

        <div class="dados">
          <div class="nome">${esc(pessoa.nome)}</div>

          <span class="status">
            ${esc(pessoa.status || 'ATIVO')}
          </span>

          <div class="ministerios">
            ${
              mins.length
                ? mins.slice(0,2).map(m =>
                    `<span class="ministerio">${esc(m)}</span>`
                  ).join('')
                : '<span class="ministerio">Sem ministério informado</span>'
            }

            ${
              mins.length > 2
                ? `<span class="ministerio">+${mins.length-2}</span>`
                : ''
            }
          </div>
        </div>

        <div class="seta">›</div>
      </a>
    `;
  }).join('');
}

async function abrirPerfil(index){
  const pessoa = membrosExibidos[index];
  if(!pessoa) return;

  document.getElementById('perfil').innerHTML = `
    <div class="perfil-topo">
      ${renderAvatar(pessoa,true)}
      <div>
        <div class="perfil-nome">${esc(pessoa.nome)}</div>
        <div class="perfil-status">${esc(pessoa.status || 'ATIVO')}</div>
      </div>
    </div>

    <section class="ficha-bloco">
      <div class="ficha-bloco-titulo">MINISTÉRIOS</div>
      <div class="lista-min">
        ${(pessoa.ministerios||[]).length
          ? (pessoa.ministerios||[]).map(m=>`<span class="tag">${esc(m)}</span>`).join('')
          : '<span class="observacao">Nenhum ministério vinculado no momento.</span>'}
      </div>
    </section>

    <section class="ficha-bloco">
      <div class="ficha-bloco-titulo">FICHA COMPLETA</div>
      <div class="privado-aviso">
        🔐 Os dados pessoais completos são protegidos e só ficam disponíveis para usuários autorizados da C.A.R.A.
        <br><button class="botao-login" type="button" onclick="entrarParaFicha('${esc(pessoa.id)}')">🔐 Entrar para ver a ficha</button>
        <div id="loginMsg" class="login-msg"></div>
      </div>
    </section>
  `;

  const modal = document.getElementById('modal');
  modal.classList.add('aberto');
  modal.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';

  await tentarCarregarFichaProtegida(pessoa.id);
}

async function tentarCarregarFichaProtegida(id){
  const token=localStorage.getItem('cara_sessao_token');
  if(!token) return;
  await buscarFichaCompleta(id,token);
}

async function entrarParaFicha(id){
  const token=localStorage.getItem('cara_sessao_token');

  // Reutiliza a sessão única da C.A.R.A.; não abre um login separado dentro do módulo.
  if(token){
    buscarFichaCompleta(id,token);
    return;
  }

  // Após autenticar, o usuário volta para Membros e pode abrir a ficha novamente.
  location.href='./login.html?next='+encodeURIComponent('./membros.html');
}

async function buscarFichaCompleta(id,token){
  try{
    const r=await fetch(API+'?rota=membro&id='+encodeURIComponent(id)+'&token='+encodeURIComponent(token),{
      credentials:'omit',redirect:'follow',cache:'no-store'
    });
    const dados=await r.json();
    if(!dados.sucesso){
      const msg=document.getElementById('loginMsg');
      if(msg) msg.textContent=dados.mensagem || 'Sem permissão para visualizar esta ficha.';
      return;
    }
    window.fichaAtual=dados.membro;
    fotoNova=null;
    renderFichaCompleta(dados.membro);
  }catch(e){
    console.error(e);
    const msg=document.getElementById('loginMsg');
    if(msg) msg.textContent='Não foi possível carregar a ficha completa.';
  }
}

function campoFicha(label,valor){
  return `<div class="campo"><div class="campo-label">${esc(label)}</div><div class="campo-valor">${esc(valor||'Não informado')}</div></div>`;
}

function renderFichaCompleta(p){
  const mins=p.ministerios||[];
  const botoes = p.podeEditar ? `
    <div class="acoes-ficha">
      <button class="botao-ficha botao-editar" type="button" onclick="editarFichaAtual()">✏️ Editar ficha</button>
    </div>
  ` : '';

  document.getElementById('perfil').innerHTML=`
    <div class="perfil-topo">
      ${renderAvatar(p,true)}
      <div>
        <div class="perfil-nome">${esc(p.nome)}</div>
        <div class="perfil-status">${esc(p.status||'ATIVO')}</div>
      </div>
    </div>
    ${botoes}
    <section class="ficha-bloco">

        ${campoFicha('Estado civil',p.estadoCivil)}
        ${campoFicha('Cônjuge',p.conjuge)}
        ${campoFicha('Filhos',p.filhos)}

    </section>

      <div class="ficha-bloco-titulo">VIDA CRISTÃ</div>
      <div class="ficha-grid">
        ${campoFicha('Data de conversão',p.conversao)}
        ${campoFicha('Batizado',p.batizado)}
        ${campoFicha('Igreja anterior',p.igrejaAnterior)}

    <section class="ficha-bloco"><div class="ficha-bloco-titulo">OBSERVAÇÕES DA SECRETARIA</div><div class="observacao">${esc(p.observacoes||'Nenhuma observação registrada.')}</div></section>
  `;
}

function dataInput(v){
  const s=String(v||'').trim();
  if(!s) return '';
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})$/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  return '';
}
function dataBr(v){
  const s=String(v||'').trim();
  const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? `${m[3]}/${m[2]}/${m[1]}` : s;
}
function campoEdit(id,label,valor,tipo='text'){
  if(tipo==='textarea') return `<div class="campo"><div class="campo-label">${esc(label)}</div><textarea class="campo-textarea" id="${id}">${esc(valor||'')}</textarea></div>`;
  return `<div class="campo"><div class="campo-label">${esc(label)}</div><input class="campo-input" id="${id}" type="${tipo}" value="${esc(tipo==='date'?dataInput(valor):valor||'')}"></div>`;
}
function selectEdit(id,label,valor,opcoes){
  return `<div class="campo"><div class="campo-label">${esc(label)}</div><select class="campo-select" id="${id}">${opcoes.map(o=>`<option value="${esc(o)}" ${String(valor||'').toUpperCase()===String(o).toUpperCase()?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
}
function editarFichaAtual(){
  const token=localStorage.getItem('cara_sessao_token');
  const p=window.fichaAtual;
  if(!token || !p || !p.podeEditar) return;
  document.getElementById('perfil').innerHTML=`
    <div class="perfil-topo">${renderAvatar(p,true)}<div><div class="perfil-nome">Editar membro</div><div class="perfil-status">${esc(p.status||'ATIVO')}</div></div></div>
    <div class="acoes-ficha"><button class="botao-ficha botao-salvar" id="btnSalvarFicha" type="button" onclick="salvarFichaEditada()">💾 Salvar alterações</button><button class="botao-ficha botao-cancelar" type="button" onclick="renderFichaCompleta(window.fichaAtual)">Cancelar</button></div>
    <section class="ficha-bloco"><div class="ficha-bloco-titulo">FOTO DO MEMBRO</div><div class="foto-editor">
      ${renderAvatar(p,true)}
      <div class="foto-acoes"><label class="botao-foto" for="fotoMembro">📷 Inserir / trocar foto</label><input id="fotoMembro" type="file" accept="image/jpeg,image/png,image/webp" hidden onchange="prepararFoto(event)"><div class="foto-ajuda">JPG, PNG ou WEBP. A imagem será ajustada automaticamente.</div><div id="fotoNome" class="foto-ajuda">${p.fotoUrl?'Foto atual cadastrada.':'Nenhuma foto nova selecionada.'}</div></div>
    </div></section>
    <section class="ficha-bloco"><div class="ficha-bloco-titulo">DADOS PESSOAIS</div><div class="ficha-grid">
      ${campoEdit('editNome','Nome completo',p.nome)}${campoEdit('editNascimento','Data de nascimento',p.nascimento,'date')}${campoEdit('editTelefone','Telefone',p.telefone)}${campoEdit('editEmail','E-mail',p.email,'email')}
      ${selectEdit('editEstadoCivil','Estado civil',p.estadoCivil,['Solteiro(a)','Casado(a)','Divorciado(a)','Viúvo(a)','Outro'])}${campoEdit('editConjuge','Cônjuge',p.conjuge)}${campoEdit('editFilhos','Filhos',p.filhos)}${campoEdit('editProfissao','Profissão',p.profissao)}${campoEdit('editEndereco','Endereço',p.endereco)}
    </div></section>
    <section class="ficha-bloco"><div class="ficha-bloco-titulo">VIDA CRISTÃ</div><div class="ficha-grid">
      ${campoEdit('editConversao','Data de conversão',p.conversao,'date')}${selectEdit('editBatizado','Batizado',p.batizado,['SIM','NÃO',''])}${campoEdit('editIgreja','Igreja anterior',p.igrejaAnterior)}${selectEdit('editStatus','Status',p.status||'ATIVO',['ATIVO','INATIVO'])}
    </div></section>
    <section class="ficha-bloco"><div class="ficha-bloco-titulo">CUIDADO E ORAÇÃO</div>${campoEdit('editPedido','Pedido de oração',p.pedidoOracao,'textarea')}</section>
    <section class="ficha-bloco"><div class="ficha-bloco-titulo">OBSERVAÇÕES DA SECRETARIA</div>${campoEdit('editObservacoes','Observações',p.observacoes,'textarea')}</section>
    <div id="saveMsg" class="sucesso-msg"></div>`;
}
let fotoNova=null;
function prepararFoto(event){
  const file=event.target.files && event.target.files[0]; if(!file) return;
  if(!['image/jpeg','image/png','image/webp'].includes(file.type)){alert('Escolha uma foto JPG, PNG ou WEBP.');event.target.value='';return;}
  const reader=new FileReader();
  reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1200,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);const dataUrl=canvas.toDataURL('image/jpeg',.82);fotoNova={base64:dataUrl,mime:'image/jpeg'};const nome=document.getElementById('fotoNome');if(nome) nome.textContent='Nova foto selecionada: '+file.name;const avatar=document.querySelector('.foto-editor .avatar-grande');if(avatar) avatar.innerHTML=`<img src="${dataUrl}" alt="Nova foto">`;};img.src=reader.result;};
  reader.readAsDataURL(file);
}
async function salvarFichaEditada(){
  const token=localStorage.getItem('cara_sessao_token'),p=window.fichaAtual;if(!token||!p)return;
  const btn=document.getElementById('btnSalvarFicha'),msg=document.getElementById('saveMsg');if(btn){btn.classList.add('salvando');btn.textContent='⏳ Salvando...';}if(msg)msg.textContent='';
  const dados={id:p.id,nome:document.getElementById('editNome').value.trim(),nascimento:dataBr(document.getElementById('editNascimento').value),telefone:document.getElementById('editTelefone').value.trim(),email:document.getElementById('editEmail').value.trim(),endereco:document.getElementById('editEndereco').value.trim(),estadoCivil:document.getElementById('editEstadoCivil').value,conjuge:document.getElementById('editConjuge').value.trim(),filhos:document.getElementById('editFilhos').value.trim(),conversao:dataBr(document.getElementById('editConversao').value),batizado:document.getElementById('editBatizado').value,igrejaAnterior:document.getElementById('editIgreja').value.trim(),profissao:document.getElementById('editProfissao').value.trim(),pedidoOracao:document.getElementById('editPedido').value.trim(),status:document.getElementById('editStatus').value,observacoes:document.getElementById('editObservacoes').value.trim()};
  if(fotoNova)dados.foto=fotoNova;
  try{const resposta=await postCentral({acao:'salvar-membro',token,dados});if(!resposta.sucesso)throw new Error(resposta.mensagem||'Não foi possível salvar.');if(resposta.fotoUrl)p.fotoUrl=resposta.fotoUrl;Object.assign(p,{nome:dados.nome,status:dados.status,nascimento:dados.nascimento,telefone:dados.telefone,email:dados.email,endereco:dados.endereco,estadoCivil:dados.estadoCivil,conjuge:dados.conjuge,filhos:dados.filhos,conversao:dados.conversao,batizado:dados.batizado,igrejaAnterior:dados.igrejaAnterior,profissao:dados.profissao,pedidoOracao:dados.pedidoOracao,observacoes:dados.observacoes,podeEditar:true});fotoNova=null;render(membros);renderFichaCompleta(p);}catch(e){console.error(e);if(msg)msg.textContent=e.message||'Erro ao salvar a ficha.';if(btn){btn.classList.remove('salvando');btn.textContent='💾 Salvar alterações';}}
}

function iniciarLoginGoogle(callback){
  const clientId='678445465166-bt0tirg4jgiv6op258e4eav89m3b34uq.apps.googleusercontent.com';
  const iniciar=()=>{
    if(!window.google || !google.accounts || !google.accounts.id){
      const msg=document.getElementById('loginMsg');
      if(msg) msg.textContent='O login do Google ainda está carregando. Tente novamente em alguns segundos.';
      return;
    }
    google.accounts.id.initialize({client_id:clientId,callback:response=>callback(response.credential)});
    google.accounts.id.prompt();
  };
  if(window.google && google.accounts && google.accounts.id) iniciar();
  else setTimeout(iniciar,700);
}

async function postCentral(payload){
  const r=await fetch(API,{method:'POST',credentials:'omit',redirect:'follow',cache:'no-store',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

function fecharPerfil(){
  const modal = document.getElementById('modal');

  modal.classList.remove('aberto');
  modal.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
}

document.getElementById('modal').addEventListener('click', e => {
  if(e.target.id === 'modal'){
    fecharPerfil();
  }
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    fecharPerfil();
  }
});

document.getElementById('busca').addEventListener('input', e => {
  const termo = String(e.target.value || '')
    .trim()
    .toLocaleLowerCase('pt-BR');

  if(!termo){
    render(membros);
    return;
  }

  const filtrados = membros.filter(pessoa => {
    const nome = String(pessoa.nome || '')
      .toLocaleLowerCase('pt-BR');

    const ministerios = (pessoa.ministerios || [])
      .join(' ')
      .toLocaleLowerCase('pt-BR');

    return (
      nome.includes(termo) ||
      ministerios.includes(termo)
    );
  });

  render(filtrados);
});

async function carregar(){
  const lista = document.getElementById('lista');

  try{
    const resposta = await fetch(
      API + '?rota=membros',
      {
        credentials:'omit',
        redirect:'follow',
        cache:'no-store'
      }
    );

    if(!resposta.ok){
      throw new Error('HTTP ' + resposta.status);
    }

    const dados = await resposta.json();

    if(!dados.sucesso){
      throw new Error(
        dados.mensagem || 'Não foi possível carregar os membros.'
      );
    }

    membros = Array.isArray(dados.membros)
      ? dados.membros
      : [];

    render(membros);

  }catch(erro){
    console.error(erro);

    document.getElementById('contador').textContent = '';

    lista.innerHTML = `
      <div class="erro">
        Não foi possível carregar os membros agora.
      </div>
    `;
  }
}

carregar();
</script>
