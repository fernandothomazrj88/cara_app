<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#051326"><title>Acesso e recuperação — C.A.R.A.</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 50% 10%,#173b4c,#051326 72%,#020812);color:#fff;font-family:system-ui,Arial,sans-serif}.card{width:min(460px,100%);padding:30px 24px;border-radius:24px;background:#0b2233;border:1px solid #254252;box-shadow:0 20px 60px #0007;position:relative}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:#CCFF00;border-radius:24px 24px 0 0}h1{font-size:22px;margin:5px 0 8px}p{font-size:13px;line-height:1.55;color:#c7d5e1}label{display:block;margin:14px 0 6px;font-size:12px;font-weight:700}input{width:100%;padding:13px;border-radius:10px;border:1px solid #365264;background:#071827;color:white;font:inherit}button{width:100%;padding:13px;border:0;border-radius:10px;background:#CCFF00;color:#12200a;font-weight:800;margin-top:18px;cursor:pointer}button:disabled{opacity:.6}.hidden{display:none}.status{font-size:12px;min-height:32px;margin-top:13px}.error{color:#ffbaba}.ok{color:#dfffbd}a{color:#CCFF00;font-size:12px}
</style></head><body><main class="card">
<h1 id="titulo">Acesso à C.A.R.A.</h1><p id="intro">Configure seu acesso ou recupere sua senha usando um link autorizado.</p>
<div id="formBox" class="hidden"><form id="formAcesso">
<div id="usuarioBox"><label for="usuario">Nome de usuário</label><input id="usuario" autocomplete="username" autocapitalize="none" minlength="3" maxlength="30" pattern="[a-zA-Z0-9._-]{3,30}"></div>
<label for="senha">Nova senha</label><input id="senha" type="password" autocomplete="new-password" minlength="12" maxlength="200" required>
<label for="confirmar">Confirme a senha</label><input id="confirmar" type="password" autocomplete="new-password" minlength="12" maxlength="200" required>
<button id="btnSalvar">Salvar acesso</button></form></div>
<div id="recBox"><form id="formRec"><label for="identificador">Usuário ou e-mail cadastrado</label><input id="identificador" autocomplete="username" required maxlength="254"><button id="btnRec">Enviar instruções de recuperação</button></form></div>
<div id="status" class="status" role="status" aria-live="polite"></div><p><a href="./login.html">Voltar para o login</a></p>
</main><script>
const API='https://script.google.com/macros/s/AKfycbwFGFIC3s9i6X7qsKzrfJju59Y0UXBrfS2UgNKx6P_htJWHkyguZTaceL9ohG30rAML/exec';
const params=new URLSearchParams(location.search),token=params.get('token')||'',tipo=params.get('tipo')||'',status=document.getElementById('status');
function msg(t,c=''){status.textContent=t;status.className='status '+c}
async function api(data){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(data)});if(!r.ok)throw Error('Falha de comunicação com a Central.');return r.json()}
async function init(){
 if(token){
  document.getElementById('recBox').classList.add('hidden');
  try{const r=await api({acao:'validar-token-acesso',tokenAcesso:token});if(!r.valido)throw Error(r.mensagem||'Link inválido.');
   document.getElementById('formBox').classList.remove('hidden');
   const reset=r.tipo==='recuperacao';
   document.getElementById('titulo').textContent=reset?'Redefinir senha':'Concluir primeiro acesso';
   document.getElementById('intro').textContent=reset?'Crie uma nova senha para sua conta.':'Escolha um nome de usuário e crie uma senha para acessar o aplicativo.';
   document.getElementById('usuarioBox').classList.toggle('hidden',reset);
   document.getElementById('usuario').required=!reset;
   document.getElementById('btnSalvar').textContent=reset?'Redefinir senha':'Criar acesso';
   msg('Link válido. '+(r.emailMascarado?'Conta: '+r.emailMascarado:''),'ok');
  }catch(e){msg(e.message,'error');}
 }else{
  document.getElementById('titulo').textContent='Recuperar senha';
  document.getElementById('intro').textContent='Informe seu usuário ou e-mail. Se a conta estiver ativa, enviaremos um link temporário para o e-mail cadastrado.';
 }
}
document.getElementById('formRec').addEventListener('submit',async e=>{e.preventDefault();const b=document.getElementById('btnRec');b.disabled=true;msg('Enviando solicitação...');try{const r=await api({acao:'solicitar-recuperacao',identificador:document.getElementById('identificador').value.trim()});msg(r.mensagem||'Se a conta estiver cadastrada e ativa, enviaremos as instruções.','ok');}catch(err){msg('Não foi possível concluir a solicitação agora. Tente novamente mais tarde.','error')}finally{b.disabled=false}});
document.getElementById('formAcesso').addEventListener('submit',async e=>{e.preventDefault();const pass=document.getElementById('senha').value,confirm=document.getElementById('confirmar').value;if(pass!==confirm){msg('As senhas não coincidem.','error');return}const b=document.getElementById('btnSalvar');b.disabled=true;try{const r=await api({acao:'concluir-acesso',tokenAcesso:token,nomeUsuario:document.getElementById('usuario').value.trim(),senha:pass});if(!r.sucesso)throw Error(r.mensagem||'Não foi possível salvar.');msg(r.mensagem+' Redirecionando para o login...','ok');setTimeout(()=>location.href='./login.html',1200)}catch(err){msg(err.message,'error')}finally{b.disabled=false}});
init();
</script></body></html>
