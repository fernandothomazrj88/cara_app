<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#051326"><title>Minha Jornada na Palavra — C.A.R.A.</title><link rel="icon" href="./icon-192.png"><style>
:root{--bg:#051326;--card:#0b2038;--y:#CCFF00;--w:#fff;--m:#b9c9d8;--line:#285477}*{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;background:var(--bg);color:var(--w);font-family:Arial,Helvetica,sans-serif}body{padding-bottom:88px}header{position:sticky;top:0;z-index:5;background:#071a2e;border-bottom:2px solid var(--y);padding:13px 16px;display:flex;align-items:center;gap:12px}header a{color:var(--y);text-decoration:none;font-weight:800;border:1px solid var(--y);border-radius:10px;padding:9px 12px;white-space:nowrap}header h1{font-size:19px}main{width:min(calc(100% - 28px),760px);margin:auto;padding:22px 0}.intro{color:var(--m);font-size:14px;line-height:1.5;margin-bottom:16px}.card{background:linear-gradient(145deg,#0b2038,#071a2e);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:14px}.card h2{color:var(--y);font-size:17px;margin-bottom:12px}label{display:block;font-size:13px;font-weight:700;color:#e8f0f7;margin:12px 0 6px}input,select,textarea{width:100%;border:1px solid #45617b;border-radius:9px;background:#061326;color:#fff;padding:12px;font:inherit;font-size:14px;min-height:44px}textarea{min-height:125px;resize:vertical;line-height:1.5}button{border:0;border-radius:10px;background:var(--y);color:#051326;font-weight:900;padding:12px 16px;min-height:44px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.action{width:100%;margin-top:12px}.summary{background:#061629;border:1px solid #25435d;border-radius:12px;padding:13px;line-height:1.6;font-size:14px}.status{min-height:20px;color:var(--y);font-size:13px;margin-top:10px;line-height:1.4}.history{display:grid;gap:10px}.history article{padding:12px;border:1px solid #25435d;border-radius:11px;background:#061629;overflow-wrap:anywhere}.history strong{color:var(--y);display:block;margin-bottom:5px}.history small{color:var(--m)}.history p{white-space:pre-wrap;line-height:1.5;font-size:13px;margin-top:7px}.empty{color:var(--m);font-size:13px;line-height:1.5}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,900px);padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:#071a1d;border:1px solid #29412d;border-bottom:0;border-radius:22px 22px 0 0;text-align:center;z-index:4}.bottom a{color:var(--y);text-decoration:none;font-weight:800}
</style></head><body><header><a href="./palavra.html">← Palavra</a><h1>📜 Minha Jornada</h1></header><main><p class="intro">Uma jornada pessoal de leitura e reflexão. Seus registros continuam vinculados à sua conta da C.A.R.A.</p>
<section class="card"><h2>Minha meta de leitura</h2><label for="jornadaMeta">Meta pessoal</label><input id="jornadaMeta" maxlength="180" placeholder="Ex.: Ler o Novo Testamento em 6 meses"><button type="button" class="action" id="salvarMetaJornada">Salvar meta</button></section>
<section class="card"><h2>Meu progresso</h2><div id="jornadaResumo" class="summary">Carregando sua jornada...</div></section>
<section class="card"><h2>Registrar leitura</h2><label for="jornadaLivro">Livro da Bíblia</label><select id="jornadaLivro"><option value="">Selecione um livro</option></select><label for="jornadaCapitulos">Capítulos lidos (ex.: 1-3 ou 1, 2, 5)</label><input id="jornadaCapitulos" maxlength="120" placeholder="Ex.: 1-3"><label for="jornadaData">Data da leitura</label><input id="jornadaData" type="date"><label for="jornadaReflexao">O que eu entendi / reflexão</label><textarea id="jornadaReflexao" maxlength="8000" placeholder="Registre suas observações, aprendizados e perguntas..."></textarea><button type="button" class="action" id="salvarLeituraJornada">Salvar leitura e reflexão</button><div id="jornadaStatus" class="status" role="status"></div></section>
<section class="card"><h2>Histórico de leituras</h2><div id="jornadaHistorico" class="history"><p class="empty">Nenhuma leitura carregada.</p></div></section></main><nav class="bottom"><a href="./palavra.html">Voltar ao módulo Palavra</a></nav>
<script>
(function(){const API_SESSAO_CARA='https://script.google.com/macros/s/AKfycbwFGFIC3s9i6X7qsKzrfJju59Y0UXBrfS2UgNKx6P_htJWHkyguZTaceL9ohG30rAML/exec';const livros=['Gênesis','Êxodo','Levítico','Números','Deuteronômio','Josué','Juízes','Rute','1 Samuel','2 Samuel','1 Reis','2 Reis','1 Crônicas','2 Crônicas','Esdras','Neemias','Ester','Jó','Salmos','Provérbios','Eclesiastes','Cânticos','Isaías','Jeremias','Lamentações','Ezequiel','Daniel','Oseias','Joel','Amós','Obadias','Jonas','Miqueias','Naum','Habacuque','Sofonias','Ageu','Zacarias','Malaquias','Mateus','Marcos','Lucas','João','Atos','Romanos','1 Coríntios','2 Coríntios','Gálatas','Efésios','Filipenses','Colossenses','1 Tessalonicenses','2 Tessalonicenses','1 Timóteo','2 Timóteo','Tito','Filemom','Hebreus','Tiago','1 Pedro','2 Pedro','1 João','2 João','3 João','Judas','Apocalipse'];const $=id=>document.getElementById(id),select=$('jornadaLivro');livros.forEach(l=>{const o=document.createElement('option');o.value=l;o.textContent=l;select.appendChild(o)});const hoje=new Date();$('jornadaData').value=[hoje.getFullYear(),String(hoje.getMonth()+1).padStart(2,'0'),String(hoje.getDate()).padStart(2,'0')].join('-');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}async function api(acao,dados={}){const token=localStorage.getItem('cara_sessao_token');if(!token){location.href='./login.html?next='+encodeURIComponent('./jornada-palavra.html');throw new Error('Sua sessão não foi encontrada. Entre novamente.')}const r=await fetch(API_SESSAO_CARA,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({acao,token,dados}),credentials:'omit',redirect:'follow',cache:'no-store'});if(!r.ok)throw new Error('Falha de comunicação com a Base Central.');const j=await r.json();if(!j.sucesso)throw new Error(j.mensagem||'Não foi possível concluir a operação.');return j;}async function load(){$('jornadaStatus').textContent='Carregando seus registros...';$('jornadaResumo').textContent='Carregando sua jornada...';try{const d=await api('jornada-palavra-carregar');$('jornadaMeta').value=d.meta||'';const leituras=Array.isArray(d.leituras)?d.leituras:[];const totalCap=leituras.reduce((n,x)=>n+Number(x.quantidadeCapitulos||0),0);$('jornadaResumo').innerHTML='<strong style="color:#CCFF00">Seu progresso</strong><br>Registros de leitura: '+leituras.length+'<br>Capítulos registrados: '+totalCap+'<br><span style="color:#b9c9d8">Meta: '+esc(d.meta||'Ainda não definida')+'</span>';$('jornadaHistorico').innerHTML=leituras.length?leituras.map(x=>'<article><strong>'+esc(x.livro)+' · Capítulo(s) '+esc(x.capitulos)+'</strong><small>'+esc(x.data||'Data não informada')+'</small><p>'+esc(x.reflexao||'Sem reflexão registrada.')+'</p></article>').join(''):'<p class="empty">Você ainda não registrou leituras. Comece preenchendo os campos acima.</p>';$('jornadaStatus').textContent='';}catch(e){$('jornadaResumo').textContent='Não foi possível carregar sua jornada. '+e.message;$('jornadaHistorico').innerHTML='<p class="empty">Tente abrir novamente. Seus registros salvos não foram apagados.</p>';$('jornadaStatus').textContent=e.message;}}$('salvarMetaJornada').addEventListener('click',async()=>{const b=$('salvarMetaJornada');b.disabled=true;$('jornadaStatus').textContent='Salvando meta...';try{await api('jornada-palavra-salvar-meta',{meta:$('jornadaMeta').value.trim()});$('jornadaStatus').textContent='Meta salva com sucesso.';await load()}catch(e){$('jornadaStatus').textContent=e.message}finally{b.disabled=false}});$('salvarLeituraJornada').addEventListener('click',async()=>{const livro=select.value,capitulos=$('jornadaCapitulos').value.trim(),data=$('jornadaData').value,reflexao=$('jornadaReflexao').value.trim();if(!livro||!capitulos){$('jornadaStatus').textContent='Selecione o livro e informe os capítulos lidos.';return}const b=$('salvarLeituraJornada');b.disabled=true;$('jornadaStatus').textContent='Salvando leitura...';try{await api('jornada-palavra-salvar-leitura',{livro,capitulos,data,reflexao});$('jornadaCapitulos').value='';$('jornadaReflexao').value='';$('jornadaStatus').textContent='Leitura registrada!';await load()}catch(e){$('jornadaStatus').textContent=e.message}finally{b.disabled=false}});load()})();
</script></body></html>
