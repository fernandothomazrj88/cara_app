<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#051326"><title>C.A.R.A. — Bem-vindo</title><link rel="icon" href="./icon-192.png"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;background:#051326}
.page{width:min(100%,520px);min-height:min(850px,calc(100vh - 40px));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px 18px}
.logo{display:block;width:min(88%,420px);max-height:190px;object-fit:contain;margin:0 auto 34px}
.kicker{font-size:12px;font-weight:800;letter-spacing:3px;color:#CCFF00;margin-bottom:10px}
h1{font-size:clamp(30px,8vw,42px);line-height:1.08;margin:0;color:#fff;font-weight:800}h1 span{color:#CCFF00}
.sub{color:#fff;line-height:1.6;font-size:15px;max-width:360px;margin:16px auto 32px}.slogan{font-size:clamp(17px,4.5vw,22px);line-height:1.55;max-width:440px;margin:18px auto 32px}
.actions{width:100%;display:grid;gap:14px;max-width:360px}
button{font:inherit;font-weight:800;letter-spacing:1px;border-radius:14px;padding:17px 14px;min-height:58px;cursor:pointer}
.member{background:#CCFF00;color:#051326;border:2px solid #CCFF00}.visitor{background:transparent;color:#CCFF00;border:2px solid #CCFF00}
.note{font-size:12px;color:#b8c6d8;line-height:1.5;margin-top:24px;max-width:350px}
</style></head><body><main class="page"><img class="logo" src="./logo-cara.png" alt="Logo oficial da Comunidade Apostólica Restaurando Almas"><p class="sub slogan">&ldquo;Um amor que acolhe, a verdade que liberta e a graça que restaura!&rdquo;</p><div class="actions"><button class="member" onclick="location.href='./login.html?next='+encodeURIComponent('./index.html')">SOU MEMBRO</button><button class="visitor" onclick="location.href='./visitante.html'">SOU VISITANTE</button></div><p class="note">Membros entram com a conta cadastrada. Visitantes podem consultar os conteúdos públicos.</p></main></body></html>
