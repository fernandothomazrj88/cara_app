<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#051326"><title>Convites — C.A.R.A.</title>
<style>*{box-sizing:border-box}body{margin:0;background:#051326;color:#fff;font-family:system-ui,Arial,sans-serif;padding:22px}.wrap{max-width:760px;margin:0 auto}.card{padding:24px;border-radius:20px;background:#0b2233;border:1px solid #254252;margin:18px 0;position:relative}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:#CCFF00;border-radius:20px 20px 0 0}h1{font-size:25px;margin:4px 0 8px}p{color:#c8d6e1;font-size:13px;line-height:1.5}label{display:block;margin:16px 0 7px;font-size:12px;font-weight:700}input,select{width:100%;padding:13px;border:1px solid #365264;border-radius:10px;background:#071827;color:white;font:inherit}button{padding:13px 18px;background:#CCFF00;border:0;border-radius:10px;font-weight:800;cursor:pointer}button:disabled{opacity:.5}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.status{font-size:12px;min-height:25px;margin-top:14px}.error{color:#ffbaba}.ok{color:#dfffbd}.note{font-size:11px;color:#9db0c3}a{color:#CCFF00;font-size:12px}</style></head><body><main class="wrap"><h1>Convites de acesso</h1><p>Área administrativa da C.A.R.A. para convidar usuários ativos já cadastrados na Base Central.</p>
<section class="card"><label for="token">Sessão de administrador</label><input id="token" type="password" autocomplete="off" placeholder="Cole o token de sessão do aplicativo"><p class="note">O token é usado apenas para autorizar esta operação. Não o compartilhe.</p><div class="row"><button id="carregar">Carregar usuários ativos</button></div>
<label for="usuario">Usuário para convidar</label><select id="usuario" disabled><option value="">Primeiro carregue os usuários</option></select>
<div class="row"><button id="enviar" disabled>Enviar convite por e-mail</button><button id="gerarAtivacao" disabled>Gerar código de ativação</button><button id="gerarRecuperacao" disabled>Gerar código de recuperação</button></div><div id="status" class="status" role="status" aria-live="polite"></div></section><p><a href="./index.html">Voltar ao aplicativo</a></p></main>
<script>
const API='https://script.google.com/macros/s/AKfycbwFGFIC3s9i6X7qsKzrfJju59Y0UXBrfS2UgNKx6P_htJWHkyguZTaceL9ohG30rAML/exec';
const tokenInput=document.getElementById('token'),select=document.getElementById('usuario'),status=document.getElementById('status'),btnLoad=document.getElementById('carregar'),btnSend=document.getElementById('enviar'),btnAtivar=document.getElementById('gerarAtivacao'),btnRec=document.getElementById('gerarRecuperacao');
tokenInput.value=sessionStorage.getItem('cara_sessao_token_admin')||'';
function msg(t,c=''){status.textContent=t;status.className='status '+c}
async function api(payload){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});if(!r.ok)throw Error('Falha de comunicação com a Central.');return r.json()}
btnLoad.addEventListener('click',async()=>{const token=tokenInput.value.trim();if(!token){msg('Informe o token de sessão.','error');return}btnLoad.disabled=true;msg('Carregando...');try{const r=await api({acao:'listar-usuarios-convite',token});if(!r.sucesso)throw Error(r.mensagem||'Acesso negado.');select.innerHTML='';if(!r.usuarios.length){select.add(new Option('Nenhum usuário ativo encontrado',''));btnSend.disabled=true;btnAtivar.disabled=true;btnRec.disabled=true}else{select.add(new Option('Selecione um usuário',''));r.usuarios.forEach(u=>select.add(new Option(u.idUsuario+' — '+u.email+' ('+u.perfil+')',u.idUsuario)));select.disabled=false;msg('Usuários carregados.','ok')}sessionStorage.setItem('cara_sessao_token_admin',token)}catch(e){msg(e.message,'error')}finally{btnLoad.disabled=false}});
select.addEventListener('change',()=>{btnSend.disabled=!select.value;btnAtivar.disabled=!select.value;btnRec.disabled=!select.value;});
btnSend.addEventListener('click',async()=>{const token=tokenInput.value.trim(),idUsuario=select.value;if(!idUsuario)return;btnSend.disabled=true;msg('Enviando convite...');try{const r=await api({acao:'solicitar-convite',token,idUsuario});if(!r.sucesso)throw Error(r.mensagem||'Não foi possível enviar o convite.');msg(r.mensagem,'ok')}catch(e){msg(e.message,'error')}finally{btnSend.disabled=!select.value}});
</script></body></html>
<script>
async function gerarCodigo(tipo){const token=tokenInput.value.trim(),idUsuario=select.value;if(!token||!idUsuario)return;btnAtivar.disabled=true;btnRec.disabled=true;msg('Gerando código...');try{const r=await api({acao:'gerar-codigo-acesso',token,idUsuario,tipoCodigo:tipo});if(!r.sucesso)throw Error(r.mensagem||'Não foi possível gerar o código.');msg(r.mensagem+' Código: '+r.codigo+' — anote e entregue ao membro. Ele não será exibido novamente. Validade: '+(tipo==='ativacao'?'48 horas':'30 minutos')+'.','ok');}catch(e){msg(e.message,'error')}finally{btnAtivar.disabled=!select.value;btnRec.disabled=!select.value}}
btnAtivar.addEventListener('click',()=>gerarCodigo('ativacao'));btnRec.addEventListener('click',()=>gerarCodigo('recuperacao'));
</script>
