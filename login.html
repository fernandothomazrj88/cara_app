<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#051326">
  <title>Acesso — C.A.R.A.</title>

  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="./icon-512.png">
  <link rel="apple-touch-icon" sizes="192x192" href="./icon-192.png">

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      color:#fff;
      background:
        radial-gradient(circle at 50% 15%,#17375b 0,#0b2039 28%,#051326 68%,#020812 100%);
    }
    .login{
      width:min(440px,100%);
      text-align:center;
      padding:34px 26px 28px;
      border:1px solid #ffffff18;
      border-radius:28px;
      background:rgba(7,25,44,.92);
      box-shadow:0 25px 70px #0008;
    }
    .logo{
      width:min(310px,80%);
      max-height:180px;
      object-fit:contain;
      margin:0 auto 20px;
      display:block;
    }
    .eyebrow{
      color:#FFFF00;
      font-size:11px;
      font-weight:950;
      letter-spacing:2px;
      margin-bottom:8px;
    }
    h1{margin:0;font-size:28px;line-height:1.1}
    .sub{margin:10px 0 24px;color:#b9c8d8;font-size:14px;line-height:1.5}
    .google-area{
      min-height:48px;
      display:flex;
      justify-content:center;
      align-items:center;
      margin:12px 0 8px;
    }
    .status{
      min-height:22px;
      margin-top:14px;
      color:#b9c8d8;
      font-size:12px;
      line-height:1.45;
    }
    .status.erro{color:#ffb6b6}
    .rodape{
      margin-top:22px;
      color:#71859a;
      font-size:10px;
      line-height:1.45;
    }
    .voltar{
      display:inline-block;
      margin-top:14px;
      color:#aebdce;
      text-decoration:none;
      font-size:11px;
    }
    .voltar:hover{color:#FFFF00}
  </style>
</head>

<body>
  <main class="login">
    <img class="logo" src="./logo-cara.png" alt="C.A.R.A.">

    <div class="eyebrow">CENTRAL DE ACESSO</div>
    <h1>Shalom, Shalom!</h1>
    <p class="sub">
      Entre com a sua conta Google cadastrada na C.A.R.A.
    </p>

    <div id="googleButton" class="google-area"></div>

    <div id="status" class="status">
      Preparando o acesso...
    </div>

    <div class="rodape">
      O acesso é controlado pela lista de usuários e permissões da Base Central.
    </div>

    <a class="voltar" href="./index.html" id="voltar">Voltar</a>
  </main>

<script>
const API = 'https://script.google.com/macros/s/AKfycbwFGFIC3s9i6X7qsKzrfJju59Y0UXBrfS2UgNKx6P_htJWHkyguZTaceL9ohG30rAML/exec';
const CLIENT_ID = '678445465166-bt0tirg4jgiv6op258e4eav89m3b34uq.apps.googleusercontent.com';

function setStatus(text, erro=false){
  const el=document.getElementById('status');
  el.textContent=text||'';
  el.classList.toggle('erro',!!erro);
}

async function postCentral(payload){
  const r=await fetch(API,{
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(payload),
    credentials:'omit'
  });
  if(!r.ok) throw new Error('HTTP '+r.status);
  return await r.json();
}

async function validarSessaoExistente(){
  const token=localStorage.getItem('cara_sessao_token');
  if(!token) return false;

  try{
    const resposta=await postCentral({acao:'sessao',token});
    if(resposta && resposta.sucesso && resposta.autenticado){
      setStatus('Sessão encontrada. Entrando...');
      const params=new URLSearchParams(location.search);
      const destino=params.get('next') || './index.html';
      location.replace(destino);
      return true;
    }
  }catch(e){
    console.warn('Sessão não pôde ser validada:',e);
  }

  localStorage.removeItem('cara_sessao_token');
  return false;
}

function iniciarGoogle(){
  if(!window.google || !google.accounts || !google.accounts.id){
    setStatus('Carregando o acesso do Google...');
    setTimeout(iniciarGoogle,500);
    return;
  }

  google.accounts.id.initialize({
    client_id:CLIENT_ID,
    callback:async response=>{
      try{
        setStatus('Validando sua conta Google...');

        const resposta=await postCentral({
          acao:'login',
          credential:response.credential
        });

        if(!resposta || !resposta.sucesso || !resposta.token){
          throw new Error(
            resposta && resposta.mensagem
              ? resposta.mensagem
              : 'Não foi possível concluir o acesso.'
          );
        }

        localStorage.setItem('cara_sessao_token',resposta.token);

        const params=new URLSearchParams(location.search);
        const destino=params.get('next') || './index.html';

        setStatus('Acesso autorizado. Entrando...');
        location.replace(destino);

      }catch(e){
        console.error(e);
        setStatus(e.message || 'Não foi possível concluir o login.',true);
      }
    }
  });

  google.accounts.id.renderButton(
    document.getElementById('googleButton'),
    {
      theme:'outline',
      size:'large',
      text:'signin_with',
      shape:'rectangular',
      logo_alignment:'left',
      width:320
    }
  );

  setStatus('Escolha a conta Google para entrar.');
}

(async function(){
  const entrou=await validarSessaoExistente();
  if(!entrou) iniciarGoogle();
})();
</script>
</body>
</html>
